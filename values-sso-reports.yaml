replicaCount: 1

image:
  repository: ghcr.io/sonamsamdupkhangsar/next-auth-example
  tag: latest
  pullPolicy: Always

imagePullSecrets:
  - name: github-regcred

nameOverride: ""
fullnameOverride: "sso-reports"

serviceAccount:
  create: false
  annotations: {}
  name:

rbac:
  create: false

podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

ingress:
  enabled: false

httproute:
  gatewayName: shared-tls-gateway
  namespace: main
  hostnames:
    - sso-reports.openissuer.com
  httpsListenerName: https-sso-reports
  httpListenerName: http-sso-reports
  pathPrefix: /nextauth

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
postgres:

envs:
  - name: NEXTAUTH_URL
    value: https://sso-reports.openissuer.com/nextauth/api/auth
  - name: NEXT_PUBLIC_BASE_PATH
    value: /nextauth
  - name: NEXT_PUBLIC_APP_NAME
    value: OpenIssuer Reports
  - name: NEXT_PUBLIC_SSO_PARTNER_NAME
    value: OpenIssuer Workspace
  - name: NEXT_PUBLIC_SSO_PARTNER_URL
    value: https://sso-workspace.openissuer.com/nextauth/sso
  - name: OPENISSUER_ISSUER
    value: https://summit.openissuer.com/issuer
  - name: OPENISSUER_PROVIDER_ID
    value: myauth
  - name: OPENISSUER_SCOPES
    value: openid profile

secretFiles:
  - file: sso-reports-secrets
    keys:
      - name: NEXTAUTH_SECRET
        key: NEXTAUTH_SECRET
      - name: OPENISSUER_CLIENT_ID
        key: OPENISSUER_CLIENT_ID
      - name: OPENISSUER_CLIENT_SECRET
        key: OPENISSUER_CLIENT_SECRET
